    wrapR: { epk: HDC.b64(epk), iv: HDC.b64(ivR), ct: HDC.b64(wr.ct), tag: HDC.b64(wr.tag) } };
  env.sha256 = HDC.hex(HDC.sha256(HDC.utf8(JSON.stringify(env.body))));
  return env;
};
/* open(env, {K} or {R}) -> json string. Checks integrity hash first, then GCM tags. */
HDC.open = function (env, k) {
  if (env.v !== 2) throw new Error('Unsupported backup version');
  if (HDC.hex(HDC.sha256(HDC.utf8(JSON.stringify(env.body)))) !== env.sha256) throw new Error('Backup file corrupted (checksum mismatch)');
  var dek;
  if (k.K) { var w = env.wrapK; dek = HDC.decrypt(k.K, HDC.unb64(w.iv), HDC.unb64(w.ct), HDC.unb64(w.tag)); }
  else {
    var r = env.wrapR, epk = HDC.unb64(r.epk), rpub = HDC.pub(k.R), shared = HDC.x25519(k.R, epk);
    dek = HDC.decrypt(HDC._kek(shared, epk, rpub), HDC.unb64(r.iv), HDC.unb64(r.ct), HDC.unb64(r.tag));
  }
  var b = env.body; return HDC.fromUtf8(HDC.decrypt(dek, HDC.unb64(b.iv), HDC.unb64(b.ct), HDC.unb64(b.tag)));
};
